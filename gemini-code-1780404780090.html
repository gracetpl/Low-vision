<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="眼動拍掣訓練">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/000000/00ffcc?text=App">

    <title>眼動儀 & 拍掣訓練系統</title>
    <style>
        * { 
            box-sizing: border-box; 
            user-select: none; 
            -webkit-user-select: none; 
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000000; overflow: hidden;
            font-family: Arial, sans-serif; position: relative;
        }

        #target-container {
            position: absolute; left: 50%; top: 50%; width: 250px; height: 250px;
            transform: translate(-50%, -50%); cursor: pointer; z-index: 10;
            touch-action: none;
        }

        .target-circle {
            width: 100%; height: 100%; border-radius: 50%; border: 6px solid #ffffff;
            position: relative; overflow: hidden; box-shadow: 0 0 25px rgba(255,255,255,0.3);
            background: radial-gradient(circle, #333 0%, #111 100%);
            display: flex; align-items: center; justify-content: center;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        #target-img { 
            width: 100%; height: 100%; object-fit: cover; display: none; 
            pointer-events: none; -webkit-user-drag: none; user-drag: none;
        }
        
        #placeholder-text { color: #888; font-size: 14px; text-align: center; padding: 10px; }

        @keyframes rainbowBorder {
            0% { border-color: #ff0000; box-shadow: 0 0 30px #ff0000; }
            16% { border-color: #ffff00; box-shadow: 0 0 30px #ffff00; }
            33% { border-color: #00ff00; box-shadow: 0 0 30px #00ff00; }
            50% { border-color: #00ffff; box-shadow: 0 0 30px #00ffff; }
            66% { border-color: #0000ff; box-shadow: 0 0 30px #0000ff; }
            83% { border-color: #ff00ff; box-shadow: 0 0 30px #ff00ff; }
            100% { border-color: #ff0000; box-shadow: 0 0 30px #ff0000; }
        }
        .border-rainbow { animation: rainbowBorder 1.5s linear infinite !important; }

        #settings-btn {
            position: fixed; top: 15px; left: 15px; font-size: 30px; color: #ffffff;
            cursor: pointer; opacity: 0.4; transition: opacity 0.3s; z-index: 100;
        }
        #settings-btn:hover { opacity: 1; }
        
        #settings-panel {
            position: fixed; top: 60px; left: 15px; background: rgba(15, 15, 15, 0.95);
            color: #fff; padding: 20px; border-radius: 10px; border: 1px solid #444;
            width: 340px; display: none; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            max-height: 85vh; overflow-y: auto;
        }
        .setting-group { margin-bottom: 12px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; }
        .setting-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #bbb; }
        .setting-group input[type="range"] { width: 100%; margin-top: 5px; }
        .setting-group input[type="file"], .setting-group select {
            width: 100%; background: #222; padding: 6px; border-radius: 4px; color: #fff; border: 1px solid #444; margin-bottom: 5px;
        }
        .setting-group input[type="color"] { width: 100%; height: 35px; border: none; background: none; cursor: pointer; margin-top: 5px; }
        
        .value-display { float: right; color: #00ffcc; font-weight: bold; }
        .close-panel-btn {
            background: #00aa66; color: white; border: none; padding: 12px; width: 100%;
            border-radius: 5px; cursor: pointer; margin-top: 10px; font-weight: bold; font-size: 16px;
        }
        #btn-detect-key {
            background: #ff5500; color: white; border: none; padding: 8px; border-radius: 4px;
            cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 5px;
        }
        #mapped-key { display: block; text-align: center; color: #00ffcc; font-size: 13px; }
        
        #status-indicator {
            position: fixed; bottom: 15px; right: 15px; color: rgba(255,255,255,0.4);
            font-size: 13px; pointer-events: none; text-align: right;
        }
    </style>
</head>
<body>

    <div id="settings-btn" onclick="toggleSettings()">⚙️</div>

    <div id="settings-panel">
        <h3 style="margin-top:0; border-bottom:1px solid #444; padding-bottom:8px; color:#00ffcc;">設定後台</h3>
        
        <div class="setting-group">
            <label>🎮 1. 學生操作模式</label>
            <select id="input-mode" onchange="updateSettings()">
                <option value="eye">👀 眼動儀 / iPad 觸控</option>
                <option value="switch">🔘 拍掣 (物理按鈕) 模式</option>
            </select>
        </div>

        <div class="setting-group" id="switch-key-group" style="display: none; border: 1px solid #ff5500;">
            <label>⌨️ 2. 綁定外接拍掣</label>
            <button id="btn-detect-key" onclick="startDetectKey()">點擊這裡，然後按一下學生的拍掣</button>
            <span id="mapped-key">目前綁定的按鍵: Space</span>
        </div>

        <div class="setting-group">
            <label>🎵 3. 上傳音樂 / 圖片</label>
            <input type="file" id="audio-file" accept="audio/*" onchange="loadAudio(this)">
            <input type="file" id="image-files" accept="image/*" multiple onchange="loadImages(this)">
        </div>

        <div class="setting-group">
            <label>✨ 4. 外框視覺效果</label>
            <select id="border-style" onchange="updateSettings()">
                <option value="solid">單色高亮</option>
                <option value="rainbow">彩色閃動</option>
            </select>
            <input type="color" id="border-color" value="#00ffcc" onchange="updateSettings()">
        </div>

        <div class="setting-group">
            <label>📍 5. X 軸 / Y 軸位置</label>
            <input type="range" id="x-slider" min="10" max="90" value="50" oninput="updateSettings()">
            <input type="range" id="y-slider" min="10" max="90" value="50" oninput="updateSettings()">
        </div>

        <div class="setting-group">
            <label>🎯 6. 需持續按住/注視時間: <span id="val-gazeTime" class="value-display">0.0s</span></label>
            <input type="range" id="gaze-slider" min="0" max="3" step="0.1" value="0" oninput="updateSettings()">
        </div>

        <div class="setting-group">
            <label>⏱️ 7. 鬆手後延遲停止 (秒): <span id="val-delayTime" class="value-display">2.0s</span></label>
            <input type="range" id="delay-slider" min="0" max="5" step="0.5" value="2" oninput="updateSettings()">
        </div>

        <div class="setting-group">
            <label>📏 8. 圖案大小: <span id="val-size" class="value-display">250px</span></label>
            <input type="range" id="scale-slider" min="100" max="500" value="250" oninput="updateSettings()">
        </div>

        <button class="close-panel-btn" onclick="toggleSettings()">儲存並關閉</button>
    </div>

    <div id="target-container">
        <div class="target-circle" id="target-circle">
            <img id="target-img" alt="自訂圖片" draggable="false">
            <div id="placeholder-text">請點左上角⚙️<br>進行設定</div>
        </div>
    </div>

    <div id="status-indicator">狀態: 等待互動</div>

    <audio id="bg-music" loop></audio>

    <script>
        const targetContainer = document.getElementById('target-container');
        const targetCircle = document.getElementById('target-circle');
        const targetImg = document.getElementById('target-img');
        const placeholderText = document.getElementById('placeholder-text');
        const audio = document.getElementById('bg-music');
        const statusIndicator = document.getElementById('status-indicator');

        let fixationTimer = null;      
        let stopDelayTimer = null;   
        
        let uploadedImages = [];
        let currentImgIndex = 0;

        let currentRotation = 0; 
        let currentSpeed = 0;    
        let targetSpeed = 0;     
        const MAX_SPEED = 2;     
        let isInteracting = false; 

        let isDetectingKey = false;
        let mappedSwitchKey = 'Space'; 

        // 補回 posX 和 posY 的預設值
        let config = { 
            inputMode: 'eye', size: 250, posX: 50, posY: 50, gazeTime: 0, delayTime: 2, 
            borderStyle: 'solid', borderColor: '#00ffcc'
        };

        function toggleSettings() {
            const panel = document.getElementById('settings-panel');
            panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
        }

        function loadAudio(input) {
            const file = input.files[0];
            if (file) {
                audio.src = URL.createObjectURL(file);
                audio.play().then(() => { audio.pause(); }).catch(e => console.log("Audio Init"));
                statusIndicator.innerText = "狀態: 音樂已準備就緒";
            }
        }

        function loadImages(input) {
            uploadedImages = []; currentImgIndex = 0;
            if (input.files && input.files.length > 0) {
                for (let i = 0; i < input.files.length; i++) {
                    uploadedImages.push(URL.createObjectURL(input.files[i]));
                }
                targetImg.src = uploadedImages[0];
                targetImg.style.display = 'block';
                placeholderText.style.display = 'none';
            }
        }

        window.addEventListener('contextmenu', (e) => {
            if(e.target.tagName === 'IMG' || e.target.id === 'target-container') {
                e.preventDefault();
            }
        });

        function updateSettings() {
            config.inputMode = document.getElementById('input-mode').value;
            config.size = document.getElementById('scale-slider').value;
            config.posX = document.getElementById('x-slider').value;
            config.posY = document.getElementById('y-slider').value;
            config.gazeTime = document.getElementById('gaze-slider').value;
            config.delayTime = document.getElementById('delay-slider').value;
            config.borderStyle = document.getElementById('border-style').value;
            config.borderColor = document.getElementById('border-color').value;

            document.getElementById('val-size').innerText = config.size + "px";
            document.getElementById('val-gazeTime').innerText = parseFloat(config.gazeTime).toFixed(1) + "s";
            document.getElementById('val-delayTime').innerText = parseFloat(config.delayTime).toFixed(1) + "s";

            targetContainer.style.width = config.size + "px";
            targetContainer.style.height = config.size + "px";
            
            // 補回位置更新的邏輯
            targetContainer.style.left = config.posX + "%";
            targetContainer.style.top = config.posY + "%";

            document.getElementById('border-color').style.display = (config.borderStyle === 'solid') ? 'block' : 'none';
            document.getElementById('switch-key-group').style.display = (config.inputMode === 'switch') ? 'block' : 'none';
            
            statusIndicator.innerText = config.inputMode === 'eye' ? "狀態: 觸控/眼動模式" : "狀態: 拍掣按鈕模式";
        }

        function startDetectKey() {
            isDetectingKey = true;
            document.getElementById('btn-detect-key').innerText = "等待輸入...請按一下拍掣";
            document.getElementById('btn-detect-key').style.background = "#00ffcc";
            document.getElementById('btn-detect-key').style.color = "#000";
        }

        window.addEventListener('keydown', (e) => {
            if (isDetectingKey) {
                mappedSwitchKey = e.code;
                isDetectingKey = false;
                document.getElementById('btn-detect-key').innerText = "點擊重新綁定拍掣";
                document.getElementById('btn-detect-key').style.background = "#ff5500";
                document.getElementById('btn-detect-key').style.color = "#fff";
                document.getElementById('mapped-key').innerText = "目前綁定的按鍵: " + mappedSwitchKey;
                e.preventDefault();
                return;
            }

            if (config.inputMode === 'switch' && e.code === mappedSwitchKey) {
                e.preventDefault(); 
                if (!e.repeat && !isInteracting) { 
                    gazeEnter(null); 
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (config.inputMode === 'switch' && e.code === mappedSwitchKey) {
                e.preventDefault();
                gazeLeave(null);
            }
        });

        function animateRotation() {
            if (currentSpeed < targetSpeed) {
                currentSpeed += 0.05; 
                if(currentSpeed > targetSpeed) currentSpeed = targetSpeed;
            } else if (currentSpeed > targetSpeed) {
                let framesToStop = config.delayTime > 0 ? (config.delayTime * 60) : 1;
                let deceleration = MAX_SPEED / framesToStop;
                currentSpeed -= deceleration;
                if(currentSpeed < targetSpeed) currentSpeed = targetSpeed;
            }

            currentRotation += currentSpeed;
            targetImg.style.transform = `rotate(${currentRotation}deg)`;
            requestAnimationFrame(animateRotation);
        }
        requestAnimationFrame(animateRotation);

        function gazeEnter(e) {
            if (e && e.cancelable) e.preventDefault(); 
            if (e && config.inputMode === 'switch') return; 

            isInteracting = true;
            statusIndicator.innerText = "狀態: 偵測到輸入，啟動中...";
            
            clearTimeout(stopDelayTimer);
            clearTimeout(fixationTimer);
            
            fixationTimer = setTimeout(() => {
                startReward();
            }, config.gazeTime * 1000);
        }

        function startReward() {
            if (!audio.src || !isInteracting) return;
            statusIndicator.innerText = "狀態: 播放中...";
            
            if (uploadedImages.length > 0 && currentSpeed === 0) {
                targetImg.src = uploadedImages[currentImgIndex];
                currentImgIndex = (currentImgIndex + 1) % uploadedImages.length;
            }

            targetSpeed = MAX_SPEED;
            if (config.borderStyle === 'rainbow') {
                targetCircle.classList.add('border-rainbow');
            } else {
                targetCircle.style.borderColor = config.borderColor;
                targetCircle.style.boxShadow = `0 0 30px ${config.borderColor}`;
            }
            audio.play();
        }

        function gazeLeave(e) {
            if (e && e.cancelable) e.preventDefault();
            if (e && config.inputMode === 'switch') return; 

            isInteracting = false;
            clearTimeout(fixationTimer); 
            targetSpeed = 0; 
            
            targetCircle.classList.remove('border-rainbow');
            targetCircle.style.borderColor = "#ffffff";
            targetCircle.style.boxShadow = "0 0 25px rgba(255,255,255,0.3)";
            
            if (currentSpeed > 0 && config.delayTime > 0) {
                statusIndicator.innerText = `狀態: 鬆手，音樂緩衝 ${parseFloat(config.delayTime).toFixed(1)} 秒後停止`;
                clearTimeout(stopDelayTimer);
                stopDelayTimer = setTimeout(() => {
                    audio.pause();
                    statusIndicator.innerText = "狀態: 已完全停止";
                }, config.delayTime * 1000);
            } else {
                audio.pause();
                currentSpeed = 0; 
                statusIndicator.innerText = "狀態: 已完全停止";
            }
        }

        targetContainer.addEventListener('mouseenter', (e) => { if(config.inputMode === 'eye') gazeEnter(e); });
        targetContainer.addEventListener('mouseleave', (e) => { if(config.inputMode === 'eye') gazeLeave(e); });
        targetContainer.addEventListener('touchstart', (e) => { if(config.inputMode === 'eye') gazeEnter(e); }, { passive: false });
        targetContainer.addEventListener('touchend', (e) => { if(config.inputMode === 'eye') gazeLeave(e); });
        targetContainer.addEventListener('touchcancel', (e) => { if(config.inputMode === 'eye') gazeLeave(e); });

        updateSettings();
    </script>
</body>
</html>
